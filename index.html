<script src="https://cdn.jsdelivr.net/npm/stockfish@10.0.2/src/stockfish.asm.js"></script>
<style>
:root{--bg:#faf6ec;--fg:#1d2433;--card:#fff;--pri:#14213d;--prt:#faf6ec;--gold:#b8933f;--gr:#4f7f5a;--mut:#6b7080;--bd:#e3dac3;--l:#f0d9b5;--d:#b58863;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1726;--fg:#f1ede2;--card:#18233a;--pri:#d9b862;--prt:#14213d;--gold:#d9b862;--gr:#7fb08a;--mut:#9aa3b8;--bd:#2a3752}}
:root[data-theme="dark"]{--bg:#0f1726;--fg:#f1ede2;--card:#18233a;--pri:#d9b862;--prt:#14213d;--gold:#d9b862;--gr:#7fb08a;--mut:#9aa3b8;--bd:#2a3752}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,.brand{font-family:Georgia,"Times New Roman",serif;margin:0 0 .4em}h1{font-size:clamp(2rem,6vw,3.2rem);line-height:1.1}h2{font-size:1.5rem;margin-top:1.6em}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--card);border-bottom:1px solid var(--bd);flex-wrap:wrap}
#back{background:none;border:1px solid var(--bd);color:var(--fg);border-radius:10px;padding:6px 12px;font-weight:600;cursor:pointer}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.15rem;letter-spacing:.5px;cursor:pointer}.lg{width:32px;height:32px}
#nav{display:flex;gap:4px;flex:1;flex-wrap:wrap;justify-content:center}
#nav button{background:none;border:0;color:var(--mut);padding:6px 12px;border-radius:8px;font-weight:600;cursor:pointer}#nav button.on{background:var(--pri);color:var(--prt)}
#hud{font-size:.85rem;color:var(--mut);font-weight:600}#tm{background:none;border:1px solid var(--bd);border-radius:50%;width:34px;height:34px;color:var(--fg);cursor:pointer}
main{max-width:1000px;margin:auto;padding:16px}
button.b{background:var(--pri);color:var(--prt);border:0;border-radius:10px;padding:11px 22px;font-weight:700;font-size:1rem;cursor:pointer;margin:4px 8px 4px 0}button.b.o{background:none;color:var(--fg);border:2px solid var(--pri)}
button.s{background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:7px 13px;font-weight:600;cursor:pointer}button.s.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
button.lk{background:none;border:0;color:var(--gold);text-decoration:underline;cursor:pointer;font:inherit;padding:0 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:3px;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 4px 14px #0002}.card small,.mut{color:var(--mut)}.card.lock{opacity:.5;cursor:default}.em{font-size:2rem;line-height:1.2}
.badge{display:inline-block;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--bd);color:var(--fg);width:max-content}.badge.g{background:var(--gr);color:#fff}.badge.y{background:var(--gold);color:#fff}
.hero{display:flex;flex-wrap:wrap;gap:24px;align-items:center;padding:14px 0}.hero>div{flex:1 1 320px}
.board{width:max(260px,min(94vw,calc(100dvh - 260px),520px));aspect-ratio:1;display:grid;grid-template:repeat(8,minmax(0,1fr))/repeat(8,minmax(0,1fr));container-type:size;border:3px solid var(--pri);border-radius:6px;overflow:hidden;margin:8px auto}

.sq{position:relative;aspect-ratio:1;min-width:0;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.l{background:var(--l)}.d{background:var(--d)}.pc{font-size:9.2cqw;line-height:1}
.pc.w{color:#fff;text-shadow:0 0 2px #000,0 0 2px #000,0 1px 1px #000}.pc.b{color:#161616;text-shadow:0 0 2px #fff9}
.rk,.fl{position:absolute;font-size:2.4cqw;font-style:normal;font-weight:700;opacity:.65;pointer-events:none}.rk{top:3%;left:5%}.fl{bottom:3%;right:5%}
.last{background-image:linear-gradient(#f2d34f77,#f2d34f77)}.sel{box-shadow:inset 0 0 0 .6cqw #e9b824}.chk{background-image:radial-gradient(#e33,transparent 75%)}
.tg::after{content:"";position:absolute;width:3.6cqw;height:3.6cqw;border-radius:50%;background:#0005}.star::before{content:"★";position:absolute;font-size:6cqw;color:#e9b824;text-shadow:0 0 3px #000;z-index:1;opacity:.95}
.coach{background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--gold);border-radius:10px;padding:10px 14px;margin:8px auto;max-width:520px;min-height:48px}
.coach.pop{animation:pop .5s}@keyframes pop{0%{transform:scale(.9);box-shadow:0 0 0 0 var(--gold)}60%{transform:scale(1.04)}100%{transform:scale(1);box-shadow:0 0 0 12px transparent}}
.warn{max-width:520px;margin:4px auto;font-size:.9rem;color:var(--gold)}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}.mv{max-width:520px;margin:6px auto;font-size:.85rem;color:var(--mut)}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gr)}
.lv{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:520px;margin:10px 0}
.lb{aspect-ratio:1;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--fg);font:700 1.2rem Georgia,serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center}
.lb small{font:.65rem system-ui;color:var(--gold)}.lb.done{border-color:var(--gr);background:var(--gr);color:#fff}.lb.done small{color:#fff}.lb.cur{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold)}.lb.lock{opacity:.4;cursor:default}
.tile{padding:14px;border-radius:12px;background:var(--card);border:1px solid var(--bd)}.tile b{display:block;font:700 1.6rem Georgia,serif}.tile span{color:var(--mut);font-size:.8rem}
.av{width:72px;height:72px;border-radius:50%;background:var(--pri);color:var(--prt);display:flex;align-items:center;justify-content:center;font:700 2rem Georgia,serif}
.ph{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
table{width:100%;border-collapse:collapse;font-size:.9rem}td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd)}
input,select{background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;font:inherit}
.dots::after{content:"";animation:d 1s steps(4) infinite}@keyframes d{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
footer{text-align:center;color:var(--mut);padding:30px 0;font-size:.85rem}
.board.sm{width:min(88vw,440px)}
.hh{display:grid;grid-template-columns:1.1fr 1fr;gap:30px;align-items:center;padding:26px 0 10px}
.lead{font-size:1.15rem;color:var(--mut);max-width:34em}.big{padding:14px 28px!important;font-size:1.1rem!important}
.stats{display:flex;gap:30px;margin-top:22px}.stats b{font:700 1.9rem Georgia,serif;display:block}.stats span{color:var(--mut);font-size:.8rem}
.frame{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:14px;box-shadow:0 10px 30px #0002}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}.steps .tile b{font-size:1.1rem}.steps i{font:700 1.4rem Georgia,serif;color:var(--gold);font-style:normal}
.scroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity}.scroll .card{min-width:170px;scroll-snap-align:start}
.cta{background:var(--pri);color:var(--prt);border-radius:18px;padding:30px 18px;text-align:center;margin-top:30px}.cta h2{margin:0 0 8px}button.b.inv{background:var(--prt);color:var(--pri)}
.lv{max-width:560px}

@media(max-width:720px){#nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--card);border-top:1px solid var(--bd);justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));gap:2px;flex-wrap:nowrap}#nav button{flex:1;padding:11px 2px;font-size:.78rem}main{padding-bottom:92px}#hud{margin-left:auto}header{padding:6px 10px}.brand{font-size:1rem}.stats{gap:18px}h2{font-size:1.3rem}}

.pb{display:flex;justify-content:space-between;align-items:center;margin:4px 0;padding:6px 12px;background:var(--card);border:1px solid var(--bd);border-radius:10px}
.pb.act{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}.ck{font:700 1.4rem Georgia,serif;font-variant-numeric:tabular-nums}.cp{font-size:1.05rem;letter-spacing:1px;min-height:1.3em;display:inline-block}.pb.low .ck{color:#c33}

<section id="puz" class="v" hidden><div id="plist"></div>

<section id="fr" class="v" hidden></section>
<section id="me" class="v" hidden></section>
<footer><b>Chess World – Developed by Mahesh</b><br>Every Move Begins an Adventure. Progress is saved on this device.</footer></main>

if(mv){const pc=mv.piece;st.sel=null;st.star=null;const m=g.move({from:mv.from,to:mv.to,promotion:"q"});st.last=m;draw(st);st.onMove&&st.onMove(m);return}}
const p=g.get(sq);
if(p&&p.color==g.turn()&&(!st.me||p.color==st.me)){st.sel=sq;st.pt=p.type}else{if(st.sel&&st.bad)st.bad(sq,st);st.sel=null}
draw(st)}

const V={p:100,n:300,b:320,r:500,q:900,k:0};
function ev(g){let s=0;g.board().forEach((row,r)=>row.forEach((p,c)=>{if(!p)return;let v=V[p.type]+(p.type!="k"&&r>1&&r<6&&c>1&&c<6?10:0)+(p.type=="p"?(p.color=="w"?6-r:r-1)*4:0);s+=p.color=="w"?v:-v}));return g.turn()=="w"?s:-s}
function nm(g,d,a,b){if(g.in_checkmate())return -1e5-d;if(g.in_draw())return 0;if(!d)return ev(g);
const ms=g.moves({verbose:true}).sort((x,y)=>(y.captured?1:0)-(x.captured?1:0));
for(const m of ms){g.move(m);const s=-nm(g,d-1,-b,-a);g.undo();if(s>a)a=s;if(a>=b)break}return a}
function pick(g,b){const ms=g.moves({verbose:true});if(!b.d||Math.random()<b.e)return ms[Math.random()*ms.length|0];
ms.sort(()=>Math.random()-.5).sort((x,y)=>(y.captured?1:0)-(x.captured?1:0));let a=-1e9,best=ms[0];
for(const m of ms){g.move(m);const s=-nm(g,b.d-1,-1e9,-a);g.undo();if(s>a){a=s;best=m}}return best}
function loss(g,m){g.undo();let best=-1e9,mine=0;for(const x of g.moves({verbose:true})){g.move(x);const s=-nm(g,2,-1e9,1e9);g.undo();if(s>best)best=s;if(x.from==m.from&&x.to==m.to)mine=s}
g.move({from:m.from,to:m.to,promotion:m.promotion});return best-mine}

const cap=(g,c)=>g.history({verbose:true}).filter(m=>m.color==c&&m.captured).map(m=>G[m.captured]).join("");
const fmtT=ms=>{const s=Math.ceil(Math.max(0,ms)/1000);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const tcOpts=()=>TC.map(t=>`<option value="${t[1]}">${t[0]}</option>`).join("");
const gcode=()=>{const a="ABCDEFGHJKMNPQRSTUVWXYZ23456789";return[...crypto.getRandomValues(new Uint8Array(8))].map(x=>a[x%a.length]).join("")};
const gtok=()=>[...crypto.getRandomValues(new Uint8Array(12))].map(x=>x.toString(16).padStart(2,"0")).join("");
const oc=c=>c=="w"?"b":"w";
function showFriends(){if(FG&&FG.live)return frGame();frHome()}
function frHome(){show("fr");const sv=lsGet("cw_online");
$("#fr").innerHTML=`<h2 style="margin-top:0">PLAY WITH FRIENDS</h2><div class="grid"><div class="card" onclick="nav(frLocal)"><span class="em">👥</span><b>Same device</b><small>Two players, one screen. Optional chess clocks.</small></div><div class="card" onclick="nav(frOnline)"><span class="em">🌐</span><b>Online</b><small>Private room — play a friend on another device.</small></div></div>${sv?`<div class="card" style="margin-top:12px" onclick="rResume()"><b>▶ Resume online game</b><small>Room ${esc(sv.code)}</small></div>`:""}`}
function frLocal(){show("fr");$("#fr").innerHTML=`<h2 style="margin-top:0">👥 Same device</h2><p><label>Player 1 (White) <input id="n1" value="Player 1" maxlength="14"></label></p><p><label>Player 2 (Black) <input id="n2" value="Player 2" maxlength="14"></label></p><p><label>Time control <select id="tc">${tcOpts()}</select></label></p><p><label><input type="checkbox" id="au"> Rotate the board after every move</label></p><button class="b" onclick="startLocal({n1:$('#n1').value,n2:$('#n2').value,tc:+$('#tc').value,auto:$('#au').checked})">Start game</button>`}
function startLocal(o,rep){clearInterval(FT);const tc=o.tc*1000;FG={mode:"local",g:new Chess(),names:{w:(o.n1||"Player 1").slice(0,14),b:(o.n2||"Player 2").slice(0,14)},tc,t:{w:tc,b:tc},flip:false,auto:!!o.auto,over:null,o,me:null,onMove:fmv,last:null,live:1,lt:Date.now()};FT=setInterval(ftick,250);if(rep){ST[ST.length-1]=[frGame,[]];frGame()}else nav(frGame)}
function frGame(){show("fr");const f=FG;$("#fr").innerHTML=`<div class="fw"><div id="fb"></div><div id="fbd" class="board" style="width:100%"></div><div id="fw"></div></div><div id="fm" class="coach"></div><div class="row" id="fc"></div><div class="mv" id="fh"></div>`;f.el=$("#fbd");f.sel=null;draw(f);fbars();fctl();fmsg()}
function bar(c){const f=FG,t=f.t?f.t[c]:0,act=!f.over&&f.g.turn()==c&&(f.mode=="local"||f.started);return `<div class="pb ${act?"act":""} ${f.tc&&t<30000&&!f.over?"low":""}"><span><b>${c=="w"?"⬜":"⬛"} ${esc(f.names[c])}</b>${f.me==c?" (you)":""}${act?" ● to move":""}<br><span class="cp">${cap(f.g,c)}</span></span><span class="ck">${f.tc?fmtT(t):"∞"}</span></div>`}
function fbars(){const f=FG;if(!f||!$("#fb"))return;const bt=f.flip?"b":"w";$("#fb").innerHTML=bar(oc(bt));$("#fw").innerHTML=bar(bt)}
function fall(){const f=FG;if(!f||!$("#fbd"))return;f.el=$("#fbd");draw(f);fbars();fctl();fmsg()}
function resText(o){const n=c=>esc(FG.names[c]);return (o.w?`🏆 ${n(o.w)} wins`:"🤝 Draw")+" — "+({mate:"checkmate",time:"on time",resign:"by resignation",stalemate:"stalemate",agreed:"draw agreed",rep:"threefold repetition",fifty:"fifty-move rule",mat:"insufficient material",abandon:"opponent left"}[o.r]||o.r)+"."}
function fmsg(){const f=FG;if(!f||!$("#fm"))return;let t;
if(f.over)t=resText(f.over);
else if(f.mode=="online"&&!f.started)t=`⏳ Waiting room — share the code <b>${f.code}</b> or this invite link:<br><input id="il" readonly value="${esc(location.href.split("#")[0]+"#r"+f.code)}" style="width:100%;margin:6px 0"><br><button class="s" onclick="copyInv()">Copy link</button> <button class="s" onclick="shareInv()">Invite a friend</button>`;
else if(f.dr)t=f.dr==f.me?"Draw offered — waiting for a reply…":`${esc(f.names[f.dr])} offers a draw. <button class="s" onclick="rSend({t:'drawans',ok:1})">Accept</button> <button class="s" onclick="rSend({t:'drawans',ok:0})">Decline</button>`;
else if(f.g.in_check())t=`♚ Check! ${esc(f.names[f.g.turn()])} must respond.`;
else t=f.me?(f.g.turn()==f.me?"🟢 Your move.":"Waiting for "+esc(f.names[f.g.turn()])+"…"):`${esc(f.names[f.g.turn()])} to move.`;
if(f.note)t=f.note+"<br>"+t;if(f.net)t+=`<br><small class="mut">${f.net}</small>`;
$("#fm").innerHTML=t;$("#fh").textContent=f.g.history().map((s,i)=>(i%2?"":(i/2+1|0)+". ")+s).join(" ")}
function fctl(){const f=FG,o=f.over;let h;
if(f.mode=="local")h=o?`<button class="b" onclick="startLocal({...FG.o,n1:FG.names.b,n2:FG.names.w},1)">Rematch (swap colours)</button><button class="s" onclick="fLeave()">Menu</button>`:`<button class="s" onclick="FG.flip=!FG.flip;fall()">🔄 Rotate board</button><button class="s" onclick="fend({r:'agreed'})">🤝 Agree draw</button><button class="s" onclick="fend({r:'resign',w:'b'})">⬜ White resigns</button><button class="s" onclick="fend({r:'resign',w:'w'})">⬛ Black resigns</button><button class="s" onclick="startLocal(FG.o,1)">↻ Restart</button>`;
else h=o?`<button class="b" onclick="rSend({t:'rematch'})">${f.rm&&f.rm[f.me]?"Waiting for opponent…":"Rematch"}</button><button class="s" onclick="fLeave()">Leave room</button>`:`<button class="s" onclick="rSend({t:'resign'})">🏳 Resign</button><button class="s" onclick="rSend({t:'draw'})">🤝 Offer draw</button>`;
$("#fc").innerHTML=h}
function fchk(){const g=FG.g;if(!g.game_over())return null;if(g.in_checkmate())return{r:"mate",w:oc(g.turn())};if(g.in_stalemate())return{r:"stalemate"};if(g.insufficient_material())return{r:"mat"};if(g.in_threefold_repetition())return{r:"rep"};return{r:"fifty"}}
function fmv(m){const f=FG;if(f.mode=="online")return rmv(m);f.lt=Date.now();const r=fchk();if(r)return fend(r);if(f.auto)f.flip=f.g.turn()=="b";fall()}
function fend(r){const f=FG;if(f.over)return;f.over=r;f.lock=1;saveHist();fall()}
function saveHist(){const f=FG;if(!f||f.saved)return;f.saved=1;const o=f.over,n=f.g.history().length;let e;
if(f.mode=="local")e={o:"👥 "+esc(f.names.w)+" vs "+esc(f.names.b),r:"d",rt:resText(o).replace(/<[^>]*>/g,""),m:n,d:Date.now()};
else e={o:"🌐 vs "+esc(f.names[oc(f.me)]),r:o.w?(o.w==f.me?"w":"l"):"d",m:n,d:Date.now()};
P.hist.unshift(e);P.hist=P.hist.slice(0,30);save()}
function fLeave(){const f=FG;if(f){clearInterval(f.ping);clearInterval(f.hi);clearTimeout(f.jt);if(RM){RM.leave();RM=null}if(f.mode=="online")lsDel("cw_online");f.live=0}FG=null;clearInterval(FT);go(showFriends)}
function ftick(){const f=FG;if(!f||!f.live)return;const now=Date.now();
if(f.mode=="local"){if(!f.tc||f.over)return;const d=now-f.lt;f.lt=now;const c=f.g.turn();f.t[c]-=d;if(f.t[c]<=0){f.t[c]=0;return fend({r:"time",w:oc(c)})}}
else{if(f.tc&&f.started&&!f.over){const c=f.srv.turn;f.t={w:f.srv.w,b:f.srv.b};f.t[c]=f.srv[c]-(now-f.srv.at);if(f.host&&f.t[c]<=0){f.srv[c]=0;return hEnd({r:"time",w:oc(c)})}}
let n="";if(f.host&&f.gtok&&f.started&&!f.over){const s=now-f.guestSeen;if(s>12000)n="Opponent disconnected ("+Math.round(s/1000)+"s). The game ends if they don’t return within 3 minutes.";if(s>180000)return hEnd({r:"abandon",w:f.me})}
else if(!f.host&&f.hostSeen&&!f.over&&now-f.hostSeen>12000)n="Host disconnected — waiting for them to return…";
if(f.cn)n="⚠ Connection lost — reconnecting…";if(n!==f.net){f.net=n;fmsg()}}
if($("#fb"))fbars()}
/* ---- online (room capability; the host's page is the referee) ---- */
const copyInv=()=>{const i=$("#il");i.select();try{navigator.clipboard.writeText(i.value)}catch(e){document.execCommand("copy")}};
const shareInv=()=>{const u=location.href.split("#")[0]+"#r"+FG.code,t="Play chess with me on Chess World! Room code: "+FG.code;if(navigator.share)navigator.share({title:"Chess World",text:t,url:u}).catch(()=>{});else copyInv()};
function frOnline(){show("fr");$("#fr").innerHTML=`<h2 style="margin-top:0">🌐 Online play</h2>${typeof claude=="undefined"?'<div class="coach">Online rooms need the Claude artifact runtime — open this page from its claude.ai link.</div>':""}<p><label>Your name <input id="on" value="${esc(P.name)}" maxlength="14"></label></p>
<div class="tile" style="max-width:520px;margin-bottom:12px"><b style="font-size:1.1rem">Create a private room</b><p><label>Play as <select id="oc"><option value="w">White</option><option value="b">Black</option><option value="r">Random</option></select></label> <label>Time <select id="ot">${tcOpts()}</select></label></p><button class="b" onclick="rCreate()">Create room</button></div>
<div class="tile" style="max-width:520px"><b style="font-size:1.1rem">Join with a room code</b><p><input id="jc" placeholder="ROOM CODE" maxlength="8" style="text-transform:uppercase"> <button class="b" onclick="rJoin($('#jc').value)">Join</button></p></div>
<p class="mut">Both players must open this page’s claude.ai link while signed in, with permission to take part (Contributor access or above).</p>`}
function rFail(m){if(FG){clearInterval(FG.ping);clearInterval(FG.hi);clearTimeout(FG.jt)}FG=null;if(RM){RM.leave();RM=null}clearInterval(FT);frOnline();$("#fr").insertAdjacentHTML("afterbegin",'<div class="coach">'+m+"</div>")}
async function rConnect(){const f=FG;try{const room=await claude.use("room");if(!room)throw 0;RM=await room.join("g"+f.code.toLowerCase());RM.on("cw",m=>{if(!m.isMe)rOn(m.data)});
RM.onPeers(ch=>{if(f.host&&f.started&&ch.joined.length)rState()});RM.onConnection(ok=>{f.cn=!ok;if(ok&&!f.host)rHello();if(ok&&f.host&&f.started)rState()});
if(!f.host){rHello();f.hi=setInterval(()=>{if(!f.gotState)rHello()},2000)}f.ping=setInterval(()=>RM&&RM.emit("cw",f.host?{t:"ping"}:{t:"ping",tok:f.tok}),3000);clearInterval(FT);FT=setInterval(ftick,250);return true}catch(e){rFail("Couldn’t connect to the room service. Online play works only for signed-in viewers of this artifact.");return false}}
const rHello=()=>RM&&RM.emit("cw",{t:"join",tok:FG.tok,name:P.name});
async function rCreate(){const nm=($("#on").value||"Host").slice(0,14);P.name=nm;save();const c0=$("#oc").value,col=c0=="r"?(Math.random()<.5?"w":"b"):c0,tc=+$("#ot").value*1000;
FG={mode:"online",host:true,code:gcode(),tok:gtok(),me:col,names:{[col]:nm,[oc(col)]:"Waiting…"},tc,g:new Chess(),t:{w:tc,b:tc},srv:{w:tc,b:tc,turn:"w",at:Date.now()},started:0,over:null,flip:col=="b",live:1,lock:1,rm:{},dr:null,epoch:0,onMove:fmv,gtok:null};
if(await rConnect()){rSave();nav(frGame)}}
async function rJoin(code){code=String(code||"").trim().toUpperCase();if(!/^[A-Z0-9]{8}$/.test(code))return rFail("Enter the 8-character room code.");P.name=($("#on")&&$("#on").value||P.name).slice(0,14);save();const old=lsGet("cw_online"),tok=old&&old.code==code&&!old.host?old.tok:gtok();
FG={mode:"online",host:false,code,tok,me:null,names:{w:"…",b:"…"},tc:0,g:new Chess(),t:{w:0,b:0},srv:{w:0,b:0,turn:"w",at:Date.now()},started:0,over:null,live:1,lock:1,rm:{},dr:null,epoch:0,onMove:fmv};
$("#fr").innerHTML='<div class="coach">Joining room '+esc(code)+"…</div>";if(await rConnect()){rSave();FG.jt=setTimeout(()=>{if(FG&&!FG.gotState)rFail("Room not found, or the host isn’t online. Check the code.")},20000)}}
function rResume(){const s=lsGet("cw_online");if(!s)return;if(!s.host)return rJoin(s.code);const g=new Chess();(s.hist||[]).forEach(u=>g.move({from:u.slice(0,2),to:u.slice(2,4),promotion:u[4]}));
FG={mode:"online",host:true,code:s.code,tok:s.tok,me:s.me,names:s.names,tc:s.tc,g,t:{w:s.srv.w,b:s.srv.b},srv:{w:s.srv.w,b:s.srv.b,turn:g.turn(),at:Date.now()},started:!!s.gtok,over:s.over||null,flip:s.me=="b",live:1,lock:!s.gtok||!!s.over,rm:{},dr:null,epoch:s.ep||0,onMove:fmv,gtok:s.gtok,guestSeen:Date.now()};
rConnect().then(ok=>{if(ok)nav(frGame)})}
function rSave(){const f=FG;lsSet("cw_online",f.host?{code:f.code,tok:f.tok,host:1,me:f.me,names:f.names,tc:f.tc,hist:f.g.history({verbose:true}).map(m=>m.from+m.to+(m.promotion||"")),srv:f.srv,gtok:f.gtok,ep:f.epoch,over:f.over}:{code:f.code,tok:f.tok})}
function rSend(d){const f=FG;if(!f||!RM)return;if(f.host)hAct(f.tok,d);else RM.emit("cw",{...d,tok:f.tok})}
function rOn(d){const f=FG;if(!f||!d||typeof d!="object")return;f.host?hRecv(d):gRecv(d)}
function rState(){const f=FG;if(!RM||!f.host)return;RM.emit("cw",{t:"state",ep:f.epoch,hist:f.g.history({verbose:true}).map(m=>m.from+m.to+(m.promotion||"")),srv:{w:f.srv.w,b:f.srv.b,turn:f.g.turn()},names:f.names,tc:f.tc,over:f.over,dr:f.dr,rm:f.rm,hc:f.me,to:f.gtok,started:f.started});rSave()}
function hRecv(d){const f=FG;
if(d.t=="join"){if(typeof d.tok!="string"||d.tok.length!=24)return;if(!f.gtok){f.gtok=d.tok;f.names[oc(f.me)]=String(d.name||"Guest").slice(0,14);f.started=1;f.lock=!!f.over;f.srv.at=Date.now();f.note="🎉 "+esc(f.names[oc(f.me)])+" joined the game!";setTimeout(()=>{f.note="";fmsg()},5000)}else if(f.gtok!=d.tok){RM.emit("cw",{t:"full",to:d.tok});return}f.guestSeen=Date.now();rState();fall();return}
if(d.tok!==f.gtok)return;f.guestSeen=Date.now();if(d.t=="ping")return;hAct(d.tok,d)}
function hClock(c){const f=FG,n=Date.now();if(f.tc&&f.started&&!f.over)f.srv[c]-=n-f.srv.at;f.srv.at=n}
function hAct(tok,d){const f=FG,c=tok==f.tok?f.me:oc(f.me);if(!f.started)return;if(f.over&&d.t!="rematch")return;
if(d.t=="move"){if(f.g.turn()!=c||d.seq!==f.g.history().length||typeof d.u!="string")return rState();hClock(c);const m=f.g.move({from:d.u.slice(0,2),to:d.u.slice(2,4),promotion:d.u[4]||"q"});if(!m)return rState();f.last=m;return hAfter()}
if(d.t=="resign")return hEnd({r:"resign",w:oc(c)});
if(d.t=="draw"){f.dr=c;rState()}
else if(d.t=="drawans"&&f.dr&&f.dr!=c){if(d.ok)return hEnd({r:"agreed"});f.dr=null;rState()}
else if(d.t=="rematch"&&f.over){f.rm[c]=1;if(f.rm.w&&f.rm.b)hNew();else rState()}
fall()}
function hAfter(){const f=FG;f.srv.turn=f.g.turn();f.srv.at=Date.now();f.dr=null;const r=fchk();if(r)return hEnd(r);rState();fall();ping()}
function hEnd(r){const f=FG;if(f.over)return;f.over=r;f.lock=1;rState();saveHist();fall()}
function hNew(){const f=FG,n=f.names;f.names={w:n.b,b:n.w};f.me=oc(f.me);f.g=new Chess();f.t={w:f.tc,b:f.tc};f.srv={w:f.tc,b:f.tc,turn:"w",at:Date.now()};f.over=null;f.rm={};f.dr=null;f.epoch++;f.flip=f.me=="b";f.last=null;f.saved=0;f.lock=0;f.sel=null;rState();fall()}
function rmv(m){const f=FG;if(f.host){hClock(m.color);return hAfter()}RM&&RM.emit("cw",{t:"move",tok:f.tok,u:m.from+m.to+(m.promotion||""),seq:f.g.history().length-1});fmsg();fbars()}
function gRecv(d){const f=FG;
if(d.t=="full"&&d.to==f.tok)return rFail("This room already has two players.");
if(d.t=="ping"){if(f.gotState)f.hostSeen=Date.now();return}
if(d.t!="state"||d.to!==f.tok||!Array.isArray(d.hist))return;
f.gotState=1;f.hostSeen=Date.now();clearTimeout(f.jt);const g=new Chess();for(const u of d.hist)if(!g.move({from:u.slice(0,2),to:u.slice(2,4),promotion:u[4]}))return;
const prev=f.over,pn=f.g.history().length;f.g=g;f.me=oc(d.hc);f.flip=f.me=="b";f.names=d.names;f.tc=d.tc;f.srv={w:d.srv.w,b:d.srv.b,turn:d.srv.turn,at:Date.now()};f.over=d.over;f.dr=d.dr;f.rm=d.rm;f.started=d.started;f.epoch=d.ep;f.lock=!!d.over||!d.started;f.sel=null;f.last=g.history({verbose:true}).pop()||null;
if(d.over&&!prev)saveHist();if(!f.shown){f.shown=1;nav(frGame)}else fall();if(g.history().length>pn&&g.turn()==f.me&&!d.over)ping()}
function ping(){const f=FG;if(f.g.turn()!=f.me)return;try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}if(document.hidden){document.title="♞ Your move!";addEventListener("focus",()=>document.title="Chess World",{once:true})}}
/* init */
{const t=document.documentElement;if(P.mode)t.dataset.theme=P.mode;th(P.theme||0);go(showHome);const hm=/^#r([A-Za-z0-9]{8})$/.exec(location.hash);if(hm)setTimeout(()=>{go(showFriends);nav(frOnline);$("#jc").value=hm[1].toUpperCase()},400)}
</script></body></html>
